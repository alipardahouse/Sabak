name: Build APK and publish release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Step 1: ImageMagick aur Ghostscript install karein
      - name: Install ImageMagick and Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript
          
          # PDF read/write ki permission allow karein
          sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' /etc/ImageMagick-6/policy.xml

      # Step 2: www/pdf/ folder ke andar maujood saari original PDFs ko Image-Based PDFs se replace karein
      - name: Convert Text PDFs to Image-Based PDFs
        run: |
          if [ -d "www/pdf" ]; then
            # Pehle ek temporary directory banayein taake original files process hote waqt crash na hon
            mkdir -p temp_pdf_conversion
            
            for pdf in www/pdf/*.pdf; do
              if [ -f "$pdf" ]; then
                filename=$(basename "$pdf")
                echo "Converting $filename to image-based PDF..."
                
                # Conversion temp folder mein hogi
                convert -density 150 "$pdf" -alpha remove -quality 90 "temp_pdf_conversion/$filename"
              fi
            done
            
            # Converted files ko wapas original www/pdf folder mein overwrite kar dein
            cp -r temp_pdf_conversion/*.pdf www/pdf/
            rm -rf temp_pdf_conversion
            echo "All PDFs successfully converted and updated in www/pdf/"
          else
            echo "Error: 'www/pdf' directory not found!"
            exit 1
          fi

      - name: Add PDF.js (offline PDF reader)
        run: |
          npm install
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js        www/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdf.worker.min.js

      - name: Install Cordova and add Android platform
        run: |
          npm install -g cordova@12
          cordova platform add android@13

      - name: Build APK
        run: |
          cordova build android --debug
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/StudyLibrary.apk

      - name: Show Android color and string resources (only if build failed)
        if: failure()
        run: |
          cat platforms/android/app/src/main/res/values/colors.xml || true
          cat platforms/android/app/src/main/res/values/strings.xml || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Study Library v1.0.${{ github.run_number }}
          files: dist/StudyLibrary.apk
          generate_release_notes: true
