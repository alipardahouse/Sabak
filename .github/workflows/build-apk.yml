name: Build APK and publish release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Step 1: ImageMagick install karein aur resource limits ko barhaayein
      - name: Install ImageMagick and Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick ghostscript
          
          POLICY_PATH=$(find /etc/ImageMagick* -name "policy.xml" 2>/dev/null | head -n 1)
          
          if [ -f "$POLICY_PATH" ]; then
            echo "Updating policy and resource limits at: $POLICY_PATH"
            
            # 1. PDF read/write permission allow karein
            sudo sed -i 's/domain="coder" rights="none" pattern="PDF"/domain="coder" rights="read|write" pattern="PDF"/' "$POLICY_PATH"
            
            # 2. Resource limits ko barhaayein taake 'cache resources exhausted' error na aaye
            sudo sed -i 's/<policy domain="resource" name="memory" value="[^"]*"\/>/<policy domain="resource" name="memory" value="4GiB"\/>/' "$POLICY_PATH"
            sudo sed -i 's/<policy domain="resource" name="map" value="[^"]*"\/>/<policy domain="resource" name="map" value="4GiB"\/>/' "$POLICY_PATH"
            sudo sed -i 's/<policy domain="resource" name="area" value="[^"]*"\/>/<policy domain="resource" name="area" value="2GB"\/>/' "$POLICY_PATH"
            sudo sed -i 's/<policy domain="resource" name="disk" value="[^"]*"\/>/<policy domain="resource" name="disk" value="10GiB"\/>/' "$POLICY_PATH"
          else
            echo "Error: Policy file not found!"
            exit 1
          fi

      # Step 2: Converted PDFs ko image-based banayein (Optimized Settings)
      - name: Convert Text PDFs to Image-Based PDFs
        run: |
          if [ -d "www/pdf" ]; then
            mkdir -p temp_pdf_conversion
            
            for pdf in www/pdf/*.pdf; do
              if [ -f "$pdf" ]; then
                filename=$(basename "$pdf")
                echo "Converting $filename to image-based PDF..."
                
                # -limit cache lagaya hai taake safe side memory control mein rahe
                convert -limit memory 2GiB -limit map 2GiB -density 150 "$pdf" -alpha remove -quality 85 "temp_pdf_conversion/$filename"
              fi
            done
            
            cp -r temp_pdf_conversion/*.pdf www/pdf/
            rm -rf temp_pdf_conversion
            echo "All PDFs successfully converted and updated in www/pdf/"
          else
            echo "Error: 'www/pdf' directory not found!"
            exit 1
          fi

      - name: Add PDF.js (offline PDF reader)
        run: |
          npm install
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js        www/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdf.worker.min.js

      - name: Install Cordova and add Android platform
        run: |
          npm install -g cordova@12
          cordova platform add android@13

      - name: Build APK
        run: |
          cordova build android --debug
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/StudyLibrary.apk

      - name: Show Android color and string resources (only if build failed)
        if: failure()
        run: |
          cat platforms/android/app/src/main/res/values/colors.xml || true
          cat platforms/android/app/src/main/res/values/strings.xml || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Study Library v1.0.${{ github.run_number }}
          files: dist/StudyLibrary.apk
          generate_release_notes: true
