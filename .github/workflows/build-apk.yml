name: Build APK and publish release

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Step 1: Poppler Utilities install karein (pdftoppm ke liye jo bohot fast aur safe hai)
      - name: Install PDF Utilities and Ghostscript
        run: |
          sudo apt-get update
          sudo apt-get install -y poppler-utils ghostscript

      # Step 2: Spaces wale file names ko sahi tarike se handle karein aur image-based banayein
      - name: Convert Text PDFs to Image-Based PDFs
        run: |
          if [ -d "www/pdf" ]; then
            mkdir -p temp_pdf_conversion
            
            # File names ke spaces ko sahi se handle karne ke liye loop ko context diya hai
            SAVEIFS=$IFS
            IFS=$(echo -en "\n\b")
            
            for pdf in www/pdf/*.pdf; do
              if [ -f "$pdf" ]; then
                filename=$(basename "$pdf")
                echo "Converting: $filename"
                
                # 1. PDF ke har page ko images (PNG) mein extract karein (150 DPI)
                mkdir -p "temp_pages"
                pdftoppm -png -r 150 "$pdf" "temp_pages/page"
                
                # 2. Un saari images ko wapas ek single non-searchable PDF mein combine kar dein
                # Double quotes ("") lagaye hain taake spaces ki wajah se error na aaye
                gs -dNOPAUSE -sDEVICE=pdfwrite -sOUTPUTFILE="temp_pdf_conversion/$filename" -dBATCH temp_pages/page-*.png
                
                # Temporary pages ko clean karein agli file ke liye
                rm -rf temp_pages
              fi
            done
            
            # IFS ko wapas purani state par le aayein
            IFS=$SAVEIFS
            
            # Converted files ko wapas original folder mein copy karein
            cp -r temp_pdf_conversion/*.pdf www/pdf/
            rm -rf temp_pdf_conversion
            echo "All PDFs successfully converted without space errors!"
          else
            echo "Error: 'www/pdf' directory not found!"
            exit 1
          fi

      - name: Add PDF.js (offline PDF reader)
        run: |
          npm install
          mkdir -p www/lib
          cp node_modules/pdfjs-dist/build/pdf.min.js        www/lib/pdf.min.js
          cp node_modules/pdfjs-dist/build/pdf.worker.min.js www/lib/pdf.worker.min.js

      - name: Install Cordova and add Android platform
        run: |
          npm install -g cordova@12
          cordova platform add android@13

      - name: Build APK
        run: |
          cordova build android --debug
          mkdir -p dist
          cp platforms/android/app/build/outputs/apk/debug/app-debug.apk dist/StudyLibrary.apk

      - name: Show Android color and string resources (only if build failed)
        if: failure()
        run: |
          cat platforms/android/app/src/main/res/values/colors.xml || true
          cat platforms/android/app/src/main/res/values/strings.xml || true

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Study Library v1.0.${{ github.run_number }}
          files: dist/StudyLibrary.apk
          generate_release_notes: true
